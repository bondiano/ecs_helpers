[package]
name = "ecs_helpers"
description = "A tool for managing the deployment process of an application in Amazon Elastic Container Service (ECS)"
license = "MIT"
authors = ["Vasiliy Kuzenkov <batbondik0@gmail.com>"]
keywords = ["AWS", "cli", "ECS"]
version = "0.0.4"
edition = "2024"
rust-version = "1.92.0"
build = "./build.rs"

[[bin]]
name = "ecs_helpers"
path = "src/main.rs"

[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = "z" # Optimize for size.

[dependencies]
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-ecr = "1.120.0"
aws-sdk-ecrpublic = "1.105.0"
aws-sdk-ecs = "1.133.1"
aws-sdk-ssm = "1.114.0"
aws-smithy-runtime = { version = "1.11.3", features = ["test-util"] }
aws-smithy-types = { version = "1.5.0", features = ["test-util"] }
aws-smithy-runtime-api = { version = "1.12.3", features = ["test-util"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
git2 = "0.21.0"
http = "1.5.0"
log = "0.4.35"
miette = { version = "7.6.0", features = ["fancy"] }
regex = "1.13.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
aws-sdk-sts = "1.107.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
sealed_test = "1.1.0"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_mangen = "0.3.3"
clap_complete = "4.6.11"
